# Split deployment for K8s users or operators who want to scale, restart and
# limit each process independently. The single image is reused across services
# by overriding the command and disabling the supervisor programs that are not
# relevant to that role.
#
# Topology:
#   caddy        ──┬─→ web        (HTTP)        :7001 → octane :7001
#                  └─→ ws-server  (WebSocket)   /api/v2/server/ws → :8076
#   horizon      (queue worker, no public port)
#   redis        (state)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "7001:7001"
    depends_on:
      - web
      - ws-server
    volumes:
      - ./.docker/caddy/Caddyfile.split:/etc/caddy/Caddyfile:ro

  updater:
    image: ghcr.io/shigalin/xboard:latest
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    volumes: &shared-volumes
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
    environment:
      docker: "true"
      ENABLE_AUTO_UPDATE: "false"
      ENABLE_CADDY: "false"
      ENABLE_WEB: "false"
      ENABLE_HORIZON: "false"
      ENABLE_WS_SERVER: "false"
    command:
      - /bin/sh
      - -ec
      - |
        if [ -s /www/.env ] && grep -qE '^INSTALLED=(1|true)$$' /www/.env; then
          exec php /www/artisan xboard:update --no-interaction
        fi
        echo "[updater] Skipping update before installation."

  web:
    image: ghcr.io/shigalin/xboard:latest
    restart: unless-stopped
    depends_on:
      updater:
        condition: service_completed_successfully
    volumes: *shared-volumes
    environment:
      docker: "true"
      ENABLE_AUTO_UPDATE: "false"
      ENABLE_CADDY: "false"
      ENABLE_HORIZON: "false"
      ENABLE_WS_SERVER: "false"

  horizon:
    image: ghcr.io/shigalin/xboard:latest
    restart: unless-stopped
    depends_on:
      updater:
        condition: service_completed_successfully
    volumes: *shared-volumes
    environment:
      docker: "true"
      ENABLE_AUTO_UPDATE: "false"
      ENABLE_CADDY: "false"
      ENABLE_WEB: "false"
      ENABLE_WS_SERVER: "false"

  ws-server:
    image: ghcr.io/shigalin/xboard:latest
    restart: unless-stopped
    depends_on:
      updater:
        condition: service_completed_successfully
    volumes: *shared-volumes
    environment:
      docker: "true"
      ENABLE_AUTO_UPDATE: "false"
      ENABLE_CADDY: "false"
      ENABLE_WEB: "false"
      ENABLE_HORIZON: "false"
      WS_HOST: "0.0.0.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --unixsocket /data/redis.sock --unixsocketperm 777 --save 900 1 --save 300 10 --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

volumes:
  redis-data:
